<!doctype html>
<!-- A featured project's picture, framed with rounded corners and a neutral
     border that reads on GitHub's light and dark themes. render.sh picks the
     picture with the query: card.html?openams or card.html?openams-ui. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    box-sizing: border-box; width: 800px; height: 640px; overflow: hidden;
    border: 2px solid rgba(125, 139, 146, .35); border-radius: 22px;
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* The Cortex Bridge photo: the board, centred on its grey sweep. */
  .openams img { object-position: 50% 50%; }
  /* The Mainsail panel, whole: it is taller than the card, so it sits on
     the panel's own page colour. */
  .openams-ui { background: #121212; }
  .openams-ui img { object-fit: contain; }
</style>
</head>
<body>
<div class="card" id="card"><img id="pic" alt=""></div>
<script>
  const pictures = {
    'openams': 'brand/cortex-bridge-a4-photo.jpg',
    'openams-ui': 'brand/openams-panel-mainsail.png',
  };
  const name = location.search.slice(1);
  document.getElementById('card').classList.add(name);
  document.getElementById('pic').src = pictures[name];
</script>
</body>
</html>
